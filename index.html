<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Practice Tracker</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📚</text></svg>">
  <link rel="stylesheet" href="src/style.css?v=25" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/atom-one-dark.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
</head>
<body>
  <div class="app-shell" id="appShell">
    <!-- ── Left sidebar ─────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-icon">📚</span>
        <span class="brand-text">Progress Tracker</span>
      </div>
      <nav class="topic-nav" id="topicNav"></nav>
      <div class="sidebar-footer">
        <div class="data-buttons">
          <button id="exportButton" title="Download your progress, review schedule, and notes as a file">↓ Export</button>
          <button id="importButton" title="Restore data from a previously exported file">↑ Import</button>
        </div>
        <input type="file" id="importFile" accept="application/json,.json" hidden>
        <button id="resetButton" title="Reset progress for this topic">Reset Progress</button>
      </div>
    </aside>

    <!-- Mobile overlay backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- ── Main area ────────────────────────────────────────────────── -->
    <div class="main-area">
      <div class="topbar">
        <button class="menu-toggle" id="menuToggle" title="Menu">☰</button>
        <h1 class="topbar-title" id="topicTitle">Array</h1>
        <div class="tab-group" id="tabsRow">
          <button class="tab-btn active" id="conceptsTab">Concepts</button>
          <button class="tab-btn" id="problemsTab">Problems</button>
        </div>
        <div class="topbar-stats" id="topbarStats">
          <span class="mini-stat"><span id="completedProblems">0</span>/<span id="totalProblems">0</span></span>
          <span class="mini-progress-track"><span class="mini-progress-fill" id="progressBar"></span></span>
          <span class="mini-pct" id="progressPercentage">0%</span>
        </div>
      </div>

      <div id="content">Loading topics...</div>
    </div>
  </div>

  <script src="src/viz/colors.js?v=25"></script>
  <script src="src/viz/array.js?v=25"></script>
  <script src="src/viz/table.js?v=25"></script>
  <script src="src/viz/tree.js?v=25"></script>
  <script src="src/viz/linkedlist.js?v=25"></script>
  <script src="src/viz/graph.js?v=25"></script>
  <script src="src/viz/stackqueue.js?v=25"></script>
  <script src="src/viz/recursion.js?v=25"></script>
  <script src="src/viz/heap.js?v=25"></script>
  <script src="src/viz/index.js?v=25"></script>
  <script src="src/main.js?v=25"></script>

  <!-- Scroll navigation buttons -->
  <button class="scroll-btn scroll-top" title="Go to top" onclick="document.querySelector('.main-area').scrollTo({top:0,behavior:'smooth'})">↑</button>
  <button class="scroll-btn scroll-bottom" title="Go to bottom" onclick="document.querySelector('.main-area').scrollTo({top:document.querySelector('.main-area').scrollHeight,behavior:'smooth'})">↓</button>

  <!-- Fullscreen diagram modal -->
  <div id="diagramModal" class="diagram-modal">
    <div class="diagram-modal-header">
      <span class="diagram-modal-title">Decision Flowchart</span>
      <button class="diagram-modal-close" id="modalClose">✕</button>
    </div>
    <div class="diagram-modal-body" id="modalBody"></div>
    <div class="mermaid-controls" id="modalControls">
      <button class="btn-zoom-out" title="Zoom out">−</button>
      <span class="zoom-label">100%</span>
      <button class="btn-zoom-in" title="Zoom in">+</button>
      <div class="ctrl-divider"></div>
      <button class="btn-reset" title="Fit to screen">⊡</button>
    </div>
  </div>
</body>
</html>
